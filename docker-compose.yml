version: "3.9"

services:
  db:
    build: ./db
    ports: ["8001:8001"]
    volumes: ["./data.csv:/app/data.csv:ro"]
    networks: [nivii-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8001/health"]
      interval: 10s
      retries: 5

  ollama:
    build: ./ollama
    volumes: ["ollama_cache:/root/.ollama"]
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    configs:
      - source: ollama_entrypoint
        target: /entrypoint.sh
        mode: 0755
    networks: [nivii-net]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/models_ready"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
    # GPU note: ollama/ollama detects and uses NVIDIA CUDA automatically at runtime
    # when the NVIDIA Container Runtime is installed. No deploy.resources block needed.
    # CPU-only machines run normally — generation is slower (see README).

  nlp:
    build: ./nlp
    ports: ["8002:8002"]
    volumes: ["./nlp/logs:/app/logs"]
    networks: [nivii-net]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - DB_URL=http://db:8001
      - OLLAMA_URL=http://ollama:11434
      - SQL_MODEL=qwen2.5-coder:14b
      - SYNTHESIS_MODEL=qwen3:32b

  ui:
    build: ./ui
    ports: ["3001:3000"]
    networks: [nivii-net]
    depends_on:
      nlp:
        condition: service_started

configs:
  ollama_entrypoint:
    file: ./ollama/entrypoint.sh

volumes:
  ollama_cache:

networks:
  nivii-net:
    driver: bridge
